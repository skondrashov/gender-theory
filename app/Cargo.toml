# You must change these to your own details.
[package]
name = "gender-theory"
description = "template repository to run nannou app both in native app and web browser."
version = "0.0.1"
authors = ["You <you@example.com>"]
categories = ["wasm"]
readme = "README.md"
edition = "2021"
resolver = "2"

[lib]
name = "gender"
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
# This makes the compiled code faster and smaller, but it makes compiling slower,
# so it's only enabled in release mode.
# opt-level = 0
lto = true
strip = "symbols"
opt-level = 3

[dependencies]
# The `wasm-bindgen` crate provides the bare minimum functionality needed
# to interact with JavaScript.
wasm-bindgen = "0.2.83"
wasm-bindgen-futures = "0.4.32"
js-sys = "0.3.22"
# Readable panic messages in the browser console (release builds too; the cost is negligible).
console_error_panic_hook = "0.1.5"
async-std = { version = "1.10.0", features = ["unstable"] }
nannou = { version = "0.18.1", git = "https://github.com/nannou-org/nannou.git", rev = "287be8a4d075b17332ca0bf34649f5d25e751c00", features = [
   "wasm-experimental",
] }

# The `web-sys` crate allows you to interact with the various browser APIs,
# like the DOM.
[dependencies.web-sys]
version = "0.3.22"
features = [
   "console",
   "Window",
   "Location",

   "Headers",
   "Request",
   "RequestInit",
   "RequestMode",
   "Response",

   "AnalyserNode",
   "AudioContext",
   "AudioContextState",
   "AudioDestinationNode",
   "AudioNode",
   "AudioParam",
   "AudioBuffer",
   "AudioBufferSourceNode",
   "AudioScheduledSourceNode",
   "BaseAudioContext",
   "Storage",
   "GainNode",
   "HtmlAudioElement",
   "HtmlMediaElement",
   "MediaElementAudioSourceNode",
]

# # These crates are used for running unit tests.
[dev-dependencies]
wasm-bindgen-test = "0.3.33"
futures = "0.1.27"
js-sys = "0.3.22"

# wasm-pack 0.11 bundles a binaryen too old to validate wasm from current rustc; skip wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
